[project]
name = "sectio-moteur"
version = "0.1.0"
description = "Moteur de calcul méthode simplifiée selon Eurocode 2"
authors = [
    {name = "kdauvergne",email = "keysone.dauvergne@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.1,<0.17.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--ignore=tests/test_enrobage.py"

[tool.ruff]

line-length = 88
target-version = "py312"  # borne basse de requires-python

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "RUF", "UP"]
ignore = [
    "E501",   # longueur de ligne : déléguée à `ruff format`, qui ne
              # retouche ni docstrings ni commentaires
    "RUF001", # symboles normatifs EC2 (λ, α, ρ, Ø, ², ·) et ponctuation
    "RUF002", # française (« », —) : vocabulaire du domaine, pas des
    "RUF003", # caractères posés par erreur
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["BLE001"]