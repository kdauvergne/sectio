name: Backend

on:
  push:
    paths:
      - "backend/**"
      - "moteur/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "moteur/**"
      - ".github/workflows/backend.yml"

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sectio
          POSTGRES_USER: sectio_user
          POSTGRES_PASSWORD: motdepasse
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Installer Poetry
        run: pipx install poetry

      - name: Installer les dépendances
        working-directory: backend
        run: poetry install

      - name: Lancer les tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: cle-de-test
          DJANGO_DEBUG: "False"
          POSTGRES_DB: sectio
          POSTGRES_USER: sectio_user
          POSTGRES_PASSWORD: motdepasse
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: poetry run pytest
