[project]
name = "sectio-backend"
version = "0.1.0"
description = "backend de l'application Sectio"
authors = [
    {name = "kdauvergne",email = "keysone.dauvergne@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "django (>=6.1,<7.0)",
    "djangorestframework (>=3.18.0,<4.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
sectio-moteur = { path = "../moteur", develop = true }


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.13.0,<5.0.0)",
    "ruff (>=0.16.2,<0.17.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]

[tool.ruff.lint.isort]
known-first-party = ["calculs", "comptes", "config", "projets"]